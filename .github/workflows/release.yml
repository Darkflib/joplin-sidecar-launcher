name: Release

# Push a tag matching the version in package.json / src/manifest.json, e.g.:
#   git tag v0.3.1 && git push origin v0.3.1
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and upload assets
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package and manifest versions
        run: node scripts/check-version.js "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Build .jpl
        run: npm run package

      - name: Smoke test bundle
        run: npm run smoke

      - name: Checksum
        run: |
          tar -tvf joplin-sidecar-launcher.jpl
          sha256sum joplin-sidecar-launcher.jpl > joplin-sidecar-launcher.jpl.sha256
          cat joplin-sidecar-launcher.jpl.sha256

      # gh is preinstalled on GitHub-hosted runners, so no third-party release
      # action is needed. Tags containing a hyphen (v0.4.0-rc.1) are marked
      # as prereleases.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--title "$TAG" --generate-notes --verify-tag)
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" \
            joplin-sidecar-launcher.jpl \
            joplin-sidecar-launcher.jpl.sha256
