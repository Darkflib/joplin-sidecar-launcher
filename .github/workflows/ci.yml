name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check version consistency
        run: node scripts/check-version.js

      # --ignore-scripts skips the `prepare` hook; the package step builds anyway.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Build .jpl
        run: npm run package

      - name: Smoke test bundle
        run: npm run smoke

      - name: Verify archive contents
        run: tar -tvf joplin-sidecar-launcher.jpl

      # archive: false uploads the .jpl as-is rather than wrapped in a zip;
      # the artifact takes the file's name and `name` is ignored.
      - uses: actions/upload-artifact@v7
        with:
          path: joplin-sidecar-launcher.jpl
          archive: false
          if-no-files-found: error
          retention-days: 14
