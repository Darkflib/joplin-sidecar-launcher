version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for routine minor/patch bumps; majors still arrive separately.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Track the oldest Node that Joplin's Electron runtime ships, not the newest.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
